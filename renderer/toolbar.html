<!doctype html>
<meta charset="utf-8">
<title>Iter Browser — navigation</title>
<link rel="stylesheet" href="toolbar.css">
<div id="navbar">
  <div id="navbar-row1">
    <button id="btn-back" title="Back">&#8592;</button>
    <button id="btn-forward" title="Forward">&#8594;</button>
    <button id="btn-reload" title="Reload">&#8635;</button>
    <span class="lock-indicator" id="lock-indicator" title="">&#128274;</span>
    <button id="btn-dashboards" title="Open the generated runtime / context / atomspace / gallery dashboards">Dashboards</button>
    <button id="btn-pwq" title="Open the Pending Work Queue — where iter proposes, you dispose">PWQ</button>
    <button id="btn-crm" title="Open the COS Command Center (CRM) — contacts, tasks, events">CRM</button>
    <button id="btn-apps" title="Your local apps — every Foundry project and app folder, one click away">Apps</button>
    <!-- M9: the browsing ally (off by default): a lock suggestion that only asks, and the compass. -->
    <span id="ally-notice" role="status"><span id="ally-text"></span><button id="ally-lock">Lock it</button><button id="ally-no">No</button></span>
    <span id="compass" title="Compass" aria-label="Compass">&#10022;</span>
  </div>
  <div id="navbar-row2">
    <input id="addr" placeholder="Type a URL or search…" autocomplete="off" spellcheck="false">
    <button id="btn-go">Go</button>
    <!-- M9: find-in-page (Cmd+F). -->
    <span id="find-bar" role="search"><input id="find-text" placeholder="Find in page" autocomplete="off" spellcheck="false"><span id="find-count"></span><button id="find-prev" title="Previous (Shift+Enter)">&#8593;</button><button id="find-next" title="Next (Enter)">&#8595;</button><button id="find-close" title="Close (Esc)">&times;</button></span>
  </div>
</div>
<script src="toolbar.js"></script>
