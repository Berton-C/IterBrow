<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iter Dashboards</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0f12; color: #e9edf2; }

    strong { color: #f0c96d; }

<body>
  <main>
    <h1>Dashboards are getting ready</h1>
