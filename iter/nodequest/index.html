<style>
:root{--bg:#120e21;--panel:#1d1733;--panel2:#251d42;--gold:#ffd77a;--gold2:#a89468;--ink:#efe9d8;--dim:#9d94b5;--spark:#8be9fd;--ok:#7bd88f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(1200px 600px at 70% -10%, #2a1f52, var(--bg));color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:rgba(18,14,33,.85);border-bottom:1px solid #3a2f66;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0;color:var(--gold)} h1 .sub{color:var(--dim);font-size:13px;font-weight:400}
#sparkles{margin-left:auto;color:var(--spark);font-weight:700;font-size:16px}
main{display:grid;grid-template-columns:280px 1fr;gap:18px;padding:18px 22px;max-width:1100px;margin:0 auto}
nav.map{background:var(--panel);border:1px solid #3a2f66;border-radius:14px;padding:14px;max-height:78vh;overflow:auto}
nav.map h3{margin:2px 0 10px;color:var(--gold2);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.chapter{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--dim);font-size:13.5px;border:1px solid transparent}
.chapter.locked{cursor:default;opacity:.45}
.chapter.unlocked:hover{background:var(--panel2)}
.chapter.current{background:var(--panel2);border-color:var(--gold2);color:var(--ink)}
.chapter .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#332a5e;color:var(--gold);font-size:12px;font-weight:700;flex:none}
section.quest{background:var(--panel);border:1px solid #3a2f66;border-radius:14px;padding:20px 24px}
.banner{background:linear-gradient(90deg,#6c5ce733,#ffd77a22);border:1px solid var(--gold2);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.banner b{color:var(--gold)}
.h3head{color:var(--gold);margin:0 0 4px;font-size:18px}
.secbtns{display:flex;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
.secbtn{padding:10px 14px;border-radius:11px;border:1px solid #3a2f66;background:var(--panel2);color:var(--ink);cursor:pointer;font-size:13.5px}
.secbtn .tier{font-size:11px;color:var(--dim)}
.secbtn.active{border-color:var(--gold);box-shadow:0 0 10px #ffd77a33}
.lore{background:var(--panel2);border-radius:12px;padding:14px 16px;line-height:1.55;font-size:14.5px;color:#ded6f0}
.lore b{color:var(--gold)}
.kw{display:inline-block;background:#332a5e;color:var(--spark);border-radius:6px;padding:1px 7px;margin:1px;font-size:13px}
.qa{margin-top:16px}
.qa .q{font-size:15px;margin-bottom:10px}
.chip{display:inline-block;padding:7px 13px;margin:4px;border-radius:999px;border:1px solid #4b3f85;background:#241c44;cursor:pointer;font-size:14px;transition:.15s;color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.chip.win{background:var(--ok);color:#08210f;border-color:var(--ok);cursor:default}
.feedback{margin-top:10px;min-height:22px;font-size:14px}
.feedback.good{color:var(--ok)} .feedback.bad{color:#ffb3a0}
.tierbar{margin-top:16px;font-size:13px;color:var(--dim)} .tierbar b{color:var(--spark)}
.rules{margin-top:20px;font-size:12.5px;color:var(--dim);border-top:1px dashed #3a2f66;padding-top:12px}
footer{padding:30px;text-align:center;color:var(--dim);font-size:12px}

const SAVE_KEY='nodequest.save.v1';
let save = JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
save.sparkles = save.sparkles||0; save.tiers=save.tiers||{}; save.seen=save.seen||{}; save.done=save.done||{}; save.curSec=save.curSec||'1-1';
const TIER_NAMES=['—','✨ Sparkling','✨✨ Radiant','✨✨✨ Dazzling'];
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
function tierOf(id){return save.tiers[id]||0}
function sparkDisplay(){document.getElementById('sparkles').textContent='✨ '+save.sparkles}
function renderMap(){
  const el=document.getElementById('chapters'); el.innerHTML='';
  NODES.forEach(n=>{
    const prev=NODES.filter(x=>x.n===n.n-1)[0];
    const unlocked = n.n===1 || (prev&&save.done[prev.id]);
    const d=document.createElement('div');
    d.className='chapter '+(unlocked?'unlocked':'locked')+(n.n===1?' current':'')+(save.done[n.id]?' done':'');
    d.innerHTML='<span class="num">'+n.n+'</span><span>'+n.title+'</span>';
    if(n.n!==1){d.onclick=()=>{document.getElementById('quest').innerHTML='<div class="banner">🚧 <b>'+n.title+'</b> is locked — build it next! (Adventure currently starts at Chapter 1.)</div>';};}
    el.appendChild(d);
  });
}
function openSection(id){
  save.curSec=id; persist();
  const sec=CH1.sections.find(s=>s.id===id);
  document.querySelectorAll('.secbtn').forEach(b=>b.classList.remove('active'));
  const q=document.getElementById('quest');
  q.innerHTML='<h2 class="h3head">Chapter 1 · What is Physics?</h2><div class="secbtns" id="secbtns"></div>'
   +'<div class="banner">🏆 Quest: <b>'+sec.title+'</b> — every attempt earns sparkles, nothing can be failed. Replay freely!</div>'
   +'<div class="lore">'+sec.lore+'<br><br><b>Key words:</b> '+sec.terms.map(t=>'<span class="kw">'+t+'</span>').join(' ')+'</div>'
   +'<div id="chals"></div>'
   +'<div class="tierbar">Mastery tier: <b>'+TIER_NAMES[tierOf(id)]+'</b> — earned by exploring every challenge; replays shine brighter, never dim.</div>'
   +'<div class="rules">🛡️ NodeQuest rules: no grades · no timers · no fail states · mastery through replay · sparkles never lost.</div>';
  const sb=document.getElementById('secbtns');
  CH1.sections.forEach(s=>{
    const b=document.createElement('button'); b.className='secbtn'; b.dataset.id=s.id;
    b.innerHTML=s.label+' · '+s.title+' <span class="tier">'+TIER_NAMES[tierOf(s.id)]+'</span>';
    if(s.id===id)b.classList.add('active');
    b.onclick=()=>openSection(s.id); sb.appendChild(b);
  });
  const ch=document.getElementById('chals');
  sec.challenges.forEach((c,i)=>ch.appendChild(makeChallenge(c,i,id)));
  renderMap(); sparkDisplay();
}
function makeChallenge(c,i,secId){
  const d=document.createElement('div'); d.className='qa';
  const key=secId+'-'+i;
  d.innerHTML='<div class="q">'+(i+1)+'. '+c.q+'</div>';
  c.a.forEach((a,j)=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=a;
    b.onclick=()=>{
      if(d.querySelector('.chip.win'))return;
      if(j===c.c){
        b.classList.add('win');
        save.sparkles+=5;
        if(!save.seen[key]){save.seen[key]=true; save.sparkles+=3; checkTier(secId);}
        d.insertAdjacentHTML('beforeend','<div class="feedback good">✨ Sparkles earned! '+c.why+'</div>');
      } else {
        b.classList.remove('sel'); save.sparkles+=1;
        d.insertAdjacentHTML('beforeend','<div class="feedback bad">Not quite — sparkles for trying anyway! '+c.why+'</div>');
      }
      if(CH1.sections.every(s=>s.challenges.every((_,k)=>save.seen[s.id+'-'+k]))) save.done['phys-01']=true;
      persist(); sparkDisplay(); renderMap();
    };
    d.appendChild(b);
  });
  return d;
}
function checkTier(secId){
  const sec=CH1.sections.find(s=>s.id===secId);
  const n=sec.challenges.filter((_,i)=>save.seen[secId+'-'+i]).length;
  const t=n>=sec.challenges.length?3:(n>=2?2:(n>=1?1:0));
  save.tiers[secId]=t;
}
