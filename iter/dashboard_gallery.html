<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eray Index / Dashboard Gallery</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d10;
  --panel:#111419;
  --panel2:#0f1217;
  --line:#2a3039;
  --text:#d8dee9;
  --strong:#eef2f7;
  --muted:#808a98;
  --dim:#5f6977;
  --blue:#6ea8fe;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:58px;padding:9px 16px;background:var(--panel2);border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;white-space:nowrap}
.brand-title{color:var(--strong);font:700 14px/1.2 var(--mono)}
.brand-sub{color:var(--dim);font:10px/1.2 var(--mono)}
.tabs{display:flex;align-items:center;gap:6px;min-width:0}
.tab{
  appearance:none;border:1px solid var(--line);background:#12161c;color:#9aa4b1;
  padding:8px 13px;font:700 10px/1 var(--mono);letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer
}
.tab:hover{border-color:#4a5564;color:#d2d8e1;background:#171c23}
.tab.active{border-color:#506b8f;background:#172231;color:#9ec9ff}
.actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
.action{
  appearance:none;border:1px solid var(--line);background:#12161c;color:var(--muted);
  width:30px;height:30px;font:800 14px/1 var(--mono);cursor:pointer
}
.action:hover{color:var(--strong);border-color:#4a5564}
.stage{position:relative;min-width:0;min-height:0;background:#080a0d}

.frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:block;
  visibility:hidden;
  pointer-events:none;
  background:var(--bg);
}
.frame.active{
  visibility:visible;
  pointer-events:auto;
}

@media(max-width:760px){
  .topbar{align-items:flex-start;flex-wrap:wrap;padding:8px}
  .brand{width:100%}
  .tabs{flex:1;overflow-x:auto;padding-bottom:1px}
  .tab{padding:8px 10px}
}
</style>
</head>

    <div class="brand">
      <span class="brand-title">Eray Index</span>
      <span class="brand-sub">/ Dashboard Gallery</span>
    </div>
    <nav class="tabs" aria-label="Dashboard selection">
      <button class="tab active" data-view="runtime">Runtime</button>
      <button class="tab" data-view="context">Context</button>
      <button class="tab" data-view="atomspace">Atomspace</button>
    </nav>
    <div class="actions">
      <button class="action" id="prev" title="Previous dashboard">‹</button>
      <button class="action" id="next" title="Next dashboard">›</button>
    </div>
  </header>

:root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #111419;
    --panel-2: #151920;
    --panel-3: #191e26;
    --line: #2a3039;
    --line-strong: #38414d;
    --text: #d8dee9;
    --text-strong: #eef2f7;
    --muted: #808a98;
    --dim: #5f6977;
    --blue: #6ea8fe;
    --green: #7ccf91;
    --orange: #e7a86e;
    --violet: #b8a1e3;
    --red: #e98686;
    --cyan: #79c7d3;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, &quot;Liberation Mono&quot;, monospace;
    --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
}
code, pre, table { font-family: var(--mono); }

.dashboard {
    width: min(1500px, calc(100% - 32px));
    margin: 0 auto;
    padding: 24px 0 60px;
}

header.page-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding: 0 0 18px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
}

.page-title {
    margin: 0;
    color: var(--text-strong);
    font: 600 21px/1.2 var(--mono);
    letter-spacing: -0.02em;
}
.page-subtitle {
    margin-top: 5px;
    color: var(--muted);
    font: 11px/1.4 var(--mono);
}
.updated {
    color: var(--muted);
    font: 11px/1.4 var(--mono);
    white-space: nowrap;
}

.section {
    margin-top: 18px;
    border: 1px solid var(--line);
    background: var(--panel);
}
.section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    min-height: 44px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: #0f1217;
}
.section-title {
    margin: 0;
    color: var(--text-strong);
    font: 600 12px/1.2 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
}
.section-note {
    color: var(--muted);
    font: 10px/1.2 var(--mono);
}
.section-body { padding: 14px; }

/* cycle stats */
.stats-wrap { overflow-x: auto; }
.stats-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
    font-size: 12px;
}
.stats-table th,
.stats-table td {
    border-bottom: 1px solid var(--line);
    padding: 9px 12px;
    white-space: nowrap;
}
.stats-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: right;
    background: var(--panel-2);
}
.stats-table th:first-child,
.stats-table td:first-child { text-align: left; }
.stats-table td {
    text-align: right;
    color: #c7ced8;
}
.stats-table tbody tr:hover td { background: #151a21; }
.stats-table .num-msg { color: var(--orange); }
.stats-table .num-tool { color: var(--violet); }
.stats-table .num-combined { color: var(--blue); }
.stats-table .num-time { color: var(--green); }
.stats-table tr.summary-average td {
    color: var(--blue);
    font-weight: 700;
    background: #121821;
}
.stats-table tr.summary-total td {
    color: var(--green);
    font-weight: 700;
    background: #111913;
    border-bottom: 0;
}
.stats-table tbody tr:last-child td { border-bottom: 0; }

/* messages */
.messages-list { display: grid; gap: 8px; }
.message {
    display: grid;
    grid-template-columns: 145px minmax(0, 1fr);
    border: 1px solid var(--line);
    background: var(--panel-2);
}
.message-meta {
    padding: 10px 11px;
    border-right: 1px solid var(--line);
    background: #0f1318;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    font-family: var(--mono);
}
.message-index { color: var(--dim); font-size: 10px; }
.message-role { font-weight: 700; font-size: 11px; letter-spacing: .05em; }
.message-chars { color: var(--muted); font-size: 10px; }
.message-tool-link {
    margin-top: 3px;
    color: var(--green);
    font-size: 9px;
    overflow-wrap: anywhere;
}
.message-body { min-width: 0; padding: 11px 13px; }
.message-content {
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 12px/1.55 var(--mono);
}
.role-user .message-role { color: var(--orange); }
.role-assistant .message-role { color: var(--blue); }
.role-tool .message-role { color: var(--green); }
.role-system .message-role { color: var(--muted); }
.role-developer .message-role { color: var(--violet); }
.role-user { border-left: 2px solid #8f6845; }
.role-assistant { border-left: 2px solid #4c76aa; }
.role-tool { border-left: 2px solid #4f825d; }
.role-developer { border-left: 2px solid #786798; }

/* synchronous tool call -&gt; return exchanges */
.tool-calls {
    margin-top: 10px;
    display: grid;
    gap: 10px;
}
.tool-exchange {
    border: 1px solid #353b49;
    background: #0e1117;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset;
}
.tool-call { background: #11151c; }
.tool-call-head,
.tool-return-head {
    min-height: 32px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    font-family: var(--mono);
}
.tool-call-head {
    border-bottom: 1px solid #29303b;
    background: #171b24;
}
.tool-call-label,
.tool-return-label {
    min-width: 46px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .08em;
}
.tool-call-label { color: var(--violet); }
.tool-call-name { color: #d6c5f3; font-weight: 700; font-size: 12px; }
.tool-call-id {
    color: var(--dim);
    font-size: 9px;
    overflow-wrap: anywhere;
    margin-left: auto;
}
.call-args { display: grid; }
.call-arg {
    display: grid;
    grid-template-columns: minmax(130px, 18%) minmax(0, 1fr);
    border-bottom: 1px solid #252b36;
}
.call-arg:last-child { border-bottom: 0; }
.call-arg-key {
    padding: 8px 10px;
    color: var(--cyan);
    background: #0f1319;
    border-right: 1px solid #252b36;
    overflow-wrap: anywhere;
}
.call-arg-value,

  for &amp;quot;don&amp;#x27;t sweep this away by accident&amp;quot; rather than &amp;quot;Iter can&amp;#x27;t touch this.&amp;quot;
- `createTabAfter(afterId, url)` -- creates a tab and reorders the underlying
  Map so it lands immediately after a given tab, instead of always at the end.
  Backs &amp;quot;New Tab to the Right.&amp;quot;
- `duplicateTab(id)` -- `createTabAfter` with the same tab&amp;#x27;s current URL.
- `closeOtherTabs(keepId)` / `closeTabsToRight(id)` -- both skip pinned AND
  locked tabs. `closeTabsToRight` walks `list()`&amp;#x27;s pinned-first display order,
  not raw Map insertion order, so &amp;quot;to the right&amp;quot; always matches what&amp;#x27;s
  actually visible in the strip.
- `selectAdjacentTab(direction)` -- cycles next/previous through `list()`
  order, wrapping at both ends.
- `onTabClosed` callback, fired in `closeTab()` just before removal with a
  `{url, title, locked, pinned}` snapshot, for every close path (menu,
  sidebar UI `x` button, or the bridge) -- feeds main.js&amp;#x27;s recently-closed
  stack below.

**New main.js persistence + menus:**
- `closed_tabs.json` (`.runtime/`, capped at 20, newest first) -- a ring
  buffer of closed tabs independent of `tabs_session.json` (which only ever
  holds what&amp;#x27;s *currently* open). Backs a new **History** menu: &amp;quot;Recently
  Closed&amp;quot; (dynamic submenu, one entry per closed tab, click to reopen) and
  &amp;quot;Reopen Last Closed Tab&amp;quot; (Shift+Cmd+T). Also carries Back/Forward for the
  active tab, matching a real History menu&amp;#x27;s conventional contents.
- New **Tabs** menu: New Tab to the Right, Duplicate Tab, Select Next/Previous
  Tab (Ctrl+Tab / Ctrl+Shift+Tab), Pin Tab / Unpin Tab (checkbox, label
  flips based on the active tab), Close Other Tabs, Close Tabs to the Right.
- `tabs_session.json` (the existing restore-on-launch file) now also carries
  each tab&amp;#x27;s `pinned` flag, so pinned tabs survive a restart pinned.
- Menu is rebuilt (`Menu.setApplicationMenu(buildAppMenu())`) after every
  close/reopen so &amp;quot;Recently Closed&amp;quot; and the enabled state of &amp;quot;Reopen Last
  Closed Tab&amp;quot; are never stale -- Electron menu templates are static once
  built, they don&amp;#x27;t react to state changes on their own.
- Renderer: a pin icon (📌/📍) sits next to the lock icon on every tab pill,
  wired to a new human-only `tabs:togglePin` IPC handler (mirrors
  `tabs:toggleLock`).

**Known simplification:** the recently-closed snapshot only stores
`{url, title, closedAt}`, not the tab&amp;#x27;s locked/pinned state at the time of
close -- reopening a previously-closed tab always comes back unlocked and
unpinned. Acceptable for now since locked tabs can&amp;#x27;t reach `closeTab()` in
practice (blocked at the bridge, and the UI `x` button is disabled while

affects the rare case of manually closing a still-pinned, unlocked tab via

.c{width:min(1600px,calc(100% - 32px));margin:0 auto;padding:24px 0 54px}

.card-title{margin:0;color:var(--strong);font:700 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase}

.graph-frame{
  width:100%;height:600px;position:relative;overflow:hidden;background-color:#090c10;
  background-image:

    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;background-position:center
}
.graph-frame canvas{outline:none}
.graph-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font:10px var(--mono);letter-spacing:.03em}
.graph-hud{position:absolute;z-index:3;display:flex;gap:6px;pointer-events:none}
.graph-hud-top{top:10px;left:10px}
.graph-chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 7px;background:rgba(11,14,18,.86);border:1px solid rgba(56,65,77,.86);backdrop-filter:blur(8px);font:8px/1 var(--mono);color:var(--muted)}
.graph-chip strong{color:#c7d0dc;font-size:9px;font-weight:700}
.graph-actions{position:absolute;z-index:4;top:10px;right:10px;display:flex;gap:6px}
.graph-button{appearance:none;border:1px solid rgba(56,65,77,.92);background:rgba(11,14,18,.88);color:#9ca7b5;padding:6px 8px;font:800 8px/1 var(--mono);letter-spacing:.07em;cursor:pointer}
.graph-button:hover{color:#d7dee8;border-color:#596577;background:#12171d}.graph-frame{touch-action:none}
.graph-legend{position:absolute;z-index:3;left:10px;bottom:10px;max-width:min(70%,760px);display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.graph-legend-item{display:inline-flex;align-items:center;gap:5px;padding:4px 6px;background:rgba(11,14,18,.84);border:1px solid rgba(45,53,64,.82);font:8px/1 var(--mono);color:#8792a0;backdrop-filter:blur(7px)}
.graph-swatch{width:13px;height:1px;display:inline-block}
.graph-inspector{position:absolute;z-index:3;right:10px;bottom:10px;width:min(310px,42%);min-height:45px;padding:8px 10px;background:rgba(11,14,18,.88);border:1px solid rgba(56,65,77,.86);backdrop-filter:blur(8px);pointer-events:none}
.graph-inspector-title{color:#d8dee9;font:700 9px/1.3 var(--mono);overflow-wrap:anywhere}
