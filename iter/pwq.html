<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PWQ — Pending Work Queue</title>
<style>
  :root {
    --bg: #0f0d1a; --panel: #1a1730; --panel2: #221d3d;
    --ink: #e8e4f8; --muted: #9a92b8; --line: #3a3360;
    --gold: #d4a94e; --gold-dim: #8a6f2e;
    --green: #4ecf8a; --blue: #5aa7e8; --red: #e86a6a; --amber: #e8b45a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(ellipse at 20% -10%, #1d1836 0%, var(--bg) 60%);
    color: var(--ink); min-height: 100vh; padding: 28px 34px 60px;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  h1 { font-size: 26px; color: var(--gold); letter-spacing: 1px; font-weight: normal; }
  h1 .q { color: var(--ink); }
  .sub { color: var(--muted); font-size: 13px; font-style: italic; }
  .stats { display: flex; gap: 10px; margin: 14px 0 22px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; color: var(--muted); }
  .stat b { color: var(--ink); font-size: 16px; margin-right: 4px; }
  .fbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; color: var(--muted); cursor: pointer;
    transition: border-color .15s, color .15s; }
  .fbtn:hover { border-color: var(--gold); color: var(--ink); }
  .fbtn b { color: var(--ink); font-size: 16px; margin-right: 4px; }
  .fbtn.on { border-color: var(--gold); color: var(--ink);
    box-shadow: 0 0 0 1px var(--gold) inset; }
  .fbtn.on b { color: var(--gold); }
  .card.attention-waiting { border-color: #d4a017; box-shadow: 0 0 0 2px rgba(212,160,23,.25); }
.card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 20px; position: relative;
    transition: border-color .4s, box-shadow .4s;
  }
  .card.fresh   { border-color: var(--line); }
  .card.warming { border-color: #6b5a2e; box-shadow: 0 0 14px rgba(212,169,78,.08); }
  .card.hot     { border-color: var(--gold-dim); box-shadow: 0 0 18px rgba(212,169,78,.22); }
  .card.done    { opacity: .55; border-color: #2e5a42; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card h2 { font-size: 18px; color: var(--gold); font-weight: normal; margin-bottom: 4px; }
  .age { font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; }
  .age.hot { color: var(--amber); }
  .chips { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
  .chip { font-size: 11px; letter-spacing: .5px; padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--muted); font-family: sans-serif; }
  .chip.proposed    { color: var(--blue); border-color: #2e4a68; }
  .chip.modified    { color: var(--amber); border-color: #6b5a2e; }
  .chip.approved    { color: var(--green); border-color: #2e5a42; }
  .chip.in-progress { color: var(--blue); border-color: #2e4a68; }
  .chip.completed   { color: var(--green); border-color: #2e5a42; }
  .chip.rejected    { color: #c78686; border-color: #684040; }
  .chip.superseded  { color: var(--muted); border-color: var(--line); }
  .field { margin-bottom: 12px; }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); font-family: sans-serif; margin-bottom: 4px; }
  .ask { color: var(--ink); font-size: 14.5px; line-height: 1.55; }
  .shape { color: #c8c0e0; font-size: 14px; line-height: 1.5; background: var(--panel2);
    border-left: 3px solid var(--gold-dim); padding: 10px 14px; border-radius: 0 8px 8px 0; }
  .tracker { margin: 14px 0; padding: 14px; border: 1px solid #35546d;
    border-radius: 9px; background: #121b2a; }
  .tracker-head { display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 10px; color: var(--blue); font-family: sans-serif; font-size: 12px; }
  .tracker-row { margin-top: 8px; color: #c8d8e8; font-size: 13px; line-height: 1.45; }
  .tracker-row b { display: block; color: #7faed5; font-family: sans-serif;
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer;
    transition: border-color .2s, background .2s; }
  .opt:hover { border-color: var(--gold-dim); }
  .opt.selected { border-color: var(--gold); background: #2a2448; }
  .opt .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; margin-top: 2px; position: relative; }
  .opt.selected .radio { border-color: var(--gold); }
  .opt.selected .radio::after { content: ''; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--gold); }
  .opt b { display: block; font-size: 14px; color: var(--ink); font-weight: normal; }
  .opt span { font-size: 12.5px; color: var(--muted); }
  .input-row { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; }
  textarea { flex: 1; background: #141126; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font-family: 'Georgia', serif; font-size: 14px;
    resize: vertical; min-height: 60px; outline: none; }
  textarea:focus { border-color: var(--gold-dim); }
  .orders-box { display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    background: var(--panel2); user-select: none; transition: border-color .2s; min-width: 130px; }
  .orders-box:hover { border-color: var(--gold-dim); }
  .orders-box input { width: 20px; height: 20px; accent-color: var(--gold); cursor: pointer; }
  .orders-box label { font-size: 12px; color: var(--muted); font-family: sans-serif;
    letter-spacing: .5px; cursor: pointer; text-align: center; }
  .orders-box.given { border-color: var(--green); }
  .orders-box.given label { color: var(--green); }
  .neglog { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .neglog-entry { font-size: 12.5px; margin-bottom: 6px; color: var(--muted); line-height: 1.45; }
  .neglog-entry .who { color: var(--gold); font-family: sans-serif; font-size: 11px;
    letter-spacing: .5px; }
  .neglog-entry.user .who { color: var(--green); }
  .neglog-entry .t { font-size: 10.5px; opacity: .6; font-family: sans-serif; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .abtn { background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; font-family: sans-serif;
    cursor: pointer; transition: all .2s; }
  .abtn:hover { border-color: var(--gold-dim); color: var(--ink); }
  .abtn.alarm-on { border-color: var(--amber); color: var(--amber); }
  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 60px 0; font-size: 15px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel2);
    border: 1px solid var(--green); color: var(--green); padding: 10px 18px; border-radius: 8px;
    font-family: sans-serif; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .refresh-note { font-size: 11px; color: var(--muted); font-family: sans-serif; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>PW<span class="q">Q</span></h1>
  <span class="sub">Pending Work Queue — where iter proposes, you dispose</span>
<span class="sub" id="seedNote" style="display:none;color:var(--amber)"> · showing example content — no queue file yet</span>
</header>
<div class="stats" id="stats"></div>
<div id="queue"></div>
<div class="empty" id="empty" style="display:none">Queue is clear. Nothing waiting on your eyes. 🌙</div>
<div id="orderBell" style="display:none;position:fixed;top:14px;right:16px;background:#6b5a2e;color:#e8c56a;padding:8px 14px;border-radius:8px;font-size:13px;font-family:sans-serif;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.4)"></div>
<div class="toast" id="toast"></div>
<script>
const PWQ_PATH = '.runtime/pwq.json';
const LIVE_REFRESH_MS = 2000;
let data = null;
let filter = 'waiting'; // waiting | orders | done | archived | all
let lastRenderedSequence = null;
let refreshInFlight = null;

function fmtAge(iso) {
  // FIX 2026-09-20 20:53: guard missing/invalid timestamps
  if (!iso) return 'just now';
  const then = new Date(String(iso).replace(' ', 'T'));
  if (isNaN(then.getTime())) return 'just now';
  const hrs = (Date.now() - then.getTime()) / 3600000;
  if (hrs < 1) return 'just now';
  if (hrs < 24) return Math.floor(hrs) + 'h waiting';
  return Math.floor(hrs / 24) + 'd waiting';
}
function ageClass(iso) {
  // FIX 2026-09-20 20:53: gate-written cards may lack 'created' — never crash render
  if (!iso) return 'fresh';
  const t = new Date(String(iso).replace(' ', 'T'));
  if (isNaN(t)) return 'fresh';
  const days = (Date.now() - t) / 86400000;
  if (days >= 3) return 'hot'; if (days >= 1.5) return 'warming'; return 'fresh';
}
function statusChip(s) {
  const map = { proposed: 'proposed', modified: 'modified', approved: 'approved',
    in_progress: 'in-progress', paused: 'modified', completed: 'completed', rejected: 'rejected',
    superseded: 'superseded', archived: 'archived' };
  return '<span class="chip ' + (map[s] || 'proposed') + '">' + s.toUpperCase() + '</span>';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nowStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}

function hasHumanSignature(item) {
  return (item.approval_signatures || []).some(s => s.role === 'human_owner');
}

function isTerminal(item) {
  return ['completed', 'rejected', 'superseded'].includes(item.status);
}

async function protocolCommand(action, item, payload, commandId) {
  if (!window.iterApi || !window.iterApi.pwqCommand)
    throw new Error('This PWQ tab needs an IterBrow restart before threshold signing is available');
  const r = await window.iterApi.pwqCommand({
    action,
    proposal_id: item.id,
    payload: payload || {},
    expected_version: item.proposal_version,
    command_id: commandId || undefined,
  });
  if (!r || r.ok === false) throw new Error((r && r.error) || 'PWQ command refused');
  data = JSON.parse(r.content);
}

let usingSeed = false;

function canonicalSequence(board) {
  const sequence = Number(board && board.sequence);
  return Number.isInteger(sequence) ? sequence : null;
}

function captureViewState() {
  const active = document.activeElement;
  const state = {
    drafts: {},
    focusedFieldId: null,
    selectionStart: null,
    selectionEnd: null,
    filter,
    scrollX: window.scrollX,
    scrollY: window.scrollY,
  };
  document.querySelectorAll('textarea[data-pwq-id]').forEach(field => {
    const item = data && data.items.find(candidate => candidate.id === field.dataset.pwqId);
    const canonicalValue = String((item && item.user_input) || '');
    if (field.value !== canonicalValue) state.drafts[field.dataset.pwqId] = field.value;
    if (field === active) {
      state.focusedFieldId = field.id;
      state.selectionStart = field.selectionStart;
      state.selectionEnd = field.selectionEnd;
    }
  });
  return state;
}

function restoreViewState(state) {
  filter = state.filter;
  Object.entries(state.drafts).forEach(([proposalId, value]) => {
    const field = document.getElementById('ta-' + proposalId);
    if (field) field.value = value;
  });
  const focused = state.focusedFieldId && document.getElementById(state.focusedFieldId);
  if (focused && !focused.disabled) {
    focused.focus({ preventScroll: true });
    if (state.selectionStart !== null && state.selectionEnd !== null)
      focused.setSelectionRange(state.selectionStart, state.selectionEnd);
  }
  window.scrollTo(state.scrollX, state.scrollY);
  requestAnimationFrame(() => window.scrollTo(state.scrollX, state.scrollY));
}

async function load(reason = 'manual') {
  if (refreshInFlight) return refreshInFlight;
  refreshInFlight = (async () => {
    let nextData = null;
    let nextUsingSeed = false;
    try {
      // Preferred: app bridge (when running inside the IterBrow shell).
      if (window.iterApi && window.iterApi.pwqRead) {
      const r = await window.iterApi.pwqRead();
      if (!r || r.ok === false) throw new Error((r && r.error) || 'PWQ read refused');
        nextData = JSON.parse(r.content);
      } else {
        // Standalone fallback: canonical projection first, then example seed.
        try {
          const resp = await fetch('.runtime/pwq.json');
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          nextData = JSON.parse(await resp.text());
        } catch (runtimeError) {
          const resp = await fetch('pwq_seed.json');
          if (!resp.ok) throw runtimeError;
          nextData = JSON.parse(await resp.text());
          nextUsingSeed = true;
        }
      }
    } catch (e) {
      if (!data) {
        data = { version: 3, protocol: 'pwq_v2', items: [] };
        usingSeed = false;
        render();
      }
      toast(String(e.message || e));
      return false;
    }

    const nextSequence = canonicalSequence(nextData);
    if (nextSequence !== null && lastRenderedSequence !== null &&
        nextSequence === lastRenderedSequence) return false;

    const viewState = data ? captureViewState() : null;
    const wasRendered = lastRenderedSequence !== null;
    data = nextData;
    usingSeed = nextUsingSeed;
    render();
    if (viewState) restoreViewState(viewState);
    if (wasRendered && reason !== 'initial' && reason !== 'manual')
      toast('PWQ updated from canonical state');
    return true;
  })();
  try {
    return await refreshInFlight;
  } finally {
    refreshInFlight = null;
  }
}
function showBell(n) {
  if (!n) { document.title = 'PWQ — Pending Work Queue'; const b = document.getElementById('orderBell'); if (b) b.style.display = 'none'; return; }
  document.title = '(' + n + ') 🔔 PWQ — attention needed';
  const b = document.getElementById('orderBell');
  if (b) { b.textContent = '🔔 ' + n + ' item' + (n > 1 ? 's' : '') + ' need your attention — updates arrive live'; b.style.display = 'block'; }
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function matchesFilter(i) {
  if (filter === 'waiting') return ['proposed', 'modified', 'paused'].includes(i.status);
  if (filter === 'orders')  return ['approved', 'in_progress'].includes(i.status);
  if (filter === 'done')    return i.status === 'completed';
  if (filter === 'archived') return i.status === 'archived';
  if (filter === 'all')     return i.status !== 'archived';
  return true;
}
function fbtn(f, n, label, extra) {
  return '<div class="fbtn' + (filter === f ? ' on' : '') + '" data-f="' + f + '">' +
    '<b>' + n + '</b> ' + label + (extra ? '<span style="margin-left:8px;opacity:.75">' + extra + '</span>' : '') +
    (filter === f ? '  ▾' : '') + '</div>';
}

function render() {
  const seedNote = document.getElementById('seedNote');
  if (seedNote) seedNote.style.display = usingSeed ? 'inline' : 'none';
  const q = document.getElementById('queue');
  const stats = document.getElementById('stats');
  const items = data.items;
  const waiting = items.filter(i => ['proposed', 'modified', 'paused'].includes(i.status)).length;
  const orders = items.filter(i => ['approved', 'in_progress'].includes(i.status)).length;
  const done = items.filter(i => i.status === 'completed').length;
  const archived = items.filter(i => i.status === 'archived').length;
  const oldest = items.filter(i => !isTerminal(i))
    .map(i => i.created).sort()[0];
  stats.innerHTML =
    fbtn('waiting', waiting, 'waiting on you') +
    fbtn('orders', orders, 'orders given') +
    fbtn('done', done, 'completed') +
    fbtn('archived', archived, 'archived') +
    fbtn('all', items.filter(i => i.status !== 'archived').length, 'all active', oldest ? 'oldest ' + fmtAge(oldest) + ' waiting' : '');
  Array.from(stats.querySelectorAll('.fbtn')).forEach(b => {
    b.addEventListener('click', () => {
      filter = b.dataset.f;
      render();
    });
  });
  const shown = items.filter(matchesFilter);
  const attentionIds = items.filter(i => ['proposed', 'modified', 'paused'].includes(i.status)).map(i => i.id);
  showBell(attentionIds.length);
  document.getElementById('empty').style.display = shown.length ? 'none' : 'block';
  if (!shown.length && items.length)
    document.getElementById('empty').textContent = 'Nothing in this view — click another filter. 🌙';
  q.innerHTML = '';
  shown.forEach((item) => {
    const idx = items.indexOf(item);
    const card = document.createElement('div');
    card.className = 'card ' + (attentionIds.includes(item.id) ? 'attention-waiting ' : '') + (isTerminal(item) ? 'done' : ageClass(item.created));
    card.innerHTML = renderCard(item, idx);
    q.appendChild(card);
  });
  wireCards();
  lastRenderedSequence = canonicalSequence(data);
}

function renderCard(item, idx) {
  let h = '';
  h += '<div class="card-head"><h2>' + esc(item.title) + '</h2>' +
       '<span class="age ' + (ageClass(item.created) === 'hot' ? 'hot' : '') + '">' + fmtAge(item.created) + '</span></div>';
  h += '<div class="chips">' + statusChip(item.status) +
       (item.work_class === 'build' ? '<span class="chip" style="color:var(--blue);border-color:#35546d">BUILD</span>' : '') +
       (item.approval_status ? '<span class="chip" style="color:var(--amber);border-color:#6b5a2e">' +
         esc(item.approval_status.collected + '/' + item.approval_status.threshold + ' SIGNED') + '</span>' : '') +
       (item.alarm ? '<span class="chip" style="color:var(--amber);border-color:#6b5a2e">⏰ ' + esc(item.alarm) + '</span>' : '') + '</div>';
  h += '<div class="field"><div class="field-label">The ask</div><div class="ask">' + esc(item.ask) + '</div></div>';
  h += '<div class="field"><div class="field-label">My proposed shape</div><div class="shape">' + esc(item.proposed_shape) + '</div></div>';
  if (item.approval_status) {
    const a = item.approval_status;
    const signatures = (item.approval_signatures || []).map(s =>
      esc(s.role) + ' · ' + esc(s.signer_id) + ' · ' + esc((s.proof || {}).type || 'legacy')
    ).join('<br>') || 'No attestations yet';
    const missing = (a.required_roles || []).filter(role => !(a.roles_collected || []).includes(role));
    h += '<div class="tracker"><div class="tracker-head"><span>AUTHORIZATION · ' +
         esc(a.collected + ' of ' + a.threshold) + '</span><span>' +
         (a.ready ? 'READY' : 'WAITING') + '</span></div>' +
         '<div class="tracker-row"><b>Bound digest</b>' + esc((item.proposal_digest || '').slice(0, 16)) + '…</div>' +
         '<div class="tracker-row"><b>Attestations</b>' + signatures + '</div>' +
         (missing.length ? '<div class="tracker-row"><b>Missing roles</b>' + esc(missing.join(', ')) + '</div>' : '') +
         '</div>';
  }
  if (item.tracking) {
    const t = item.tracking;
    const stage = (t.atlas_slice ? t.atlas_slice + ' — ' : '') + t.bounded_claim +
      (t.invariants && t.invariants.length ? ' [' + t.invariants.join(', ') + ']' : '');
    h += '<div class="tracker"><div class="tracker-head"><span>TRACKING · #' + esc(t.sequence || 1) + '</span>' +
         '<span>' + esc(t.actor || '') + '</span></div>' +
         '<div class="tracker-row"><b>Target</b>' + esc(t.target) + '</div>' +
         '<div class="tracker-row"><b>Stage</b>' + esc(stage) + '</div>' +
         '<div class="tracker-row"><b>Evidence / open gaps</b>' + esc(t.evidence_open_gaps) + '</div>' +
         '<div class="tracker-row"><b>Boundaries</b>' + esc(t.boundaries) + '</div>' +
         '<div class="tracker-row"><b>Next / trigger</b>' + esc(t.next_trigger) + '</div></div>';
  } else if (item.work_class === 'build' && ['approved', 'in_progress', 'paused'].includes(item.status)) {
    h += '<div class="tracker"><div class="tracker-head"><span>TRACKING</span><span>awaiting first execution event</span></div>' +
         '<div class="tracker-row">Approved build scope has no progress evidence yet.</div></div>';
  }
  if (!isTerminal(item) && item.status !== 'archived') {
    if (item.options && item.options.length) {
      h += '<div class="field"><div class="field-label">Preference — choosing is not a signature</div><div class="options">';
      item.options.forEach((o, oi) => {
        const sel = (item.selected_option === oi) ? ' selected' : '';
        h += '<div class="opt' + sel + '" data-id="' + esc(item.id) + '" data-oi="' + oi + '">' +
             '<div class="radio"></div><div><b>' + esc(o.label) + '</b><span>' + esc(o.desc) + '</span></div></div>';
      });
      h += '</div></div>';
    }
    h += '<div class="input-row">' +
         '<textarea id="ta-' + item.id + '" data-pwq-id="' + esc(item.id) + '" ' + (item.status === 'in_progress' ? 'disabled ' : '') +
         'placeholder="' + (item.status === 'in_progress' ? 'Pause work before changing scope' : 'Optional scope change — this edits the card and requires fresh signatures; do not type approval here') + '">' + esc(item.user_input || '') + '</textarea>' +
         '<div class="orders-box' + (hasHumanSignature(item) ? ' given' : '') + '" data-id="' + esc(item.id) + '">' +
         '<input type="checkbox" id="cb-' + item.id + '"' + (hasHumanSignature(item) ? ' checked' : '') + '>' +
         '<label for="cb-' + item.id + '">' + (hasHumanSignature(item) ? '✅ OWNER<br>SIGNED' : '✍️ CLICK HERE<br>TO APPROVE') + '</label></div></div>';
    h += '<div class="card-actions">' +
         (item.status !== 'in_progress' ? '<button class="abtn" data-act="negotiate" data-id="' + esc(item.id) + '">💬 Counter-propose (log a tweak)</button>' : '') +
         (item.status !== 'in_progress' ? '<button class="abtn' + (item.alarm ? ' alarm-on' : '') + '" data-act="alarm" data-id="' + esc(item.id) + '">⏰ ' + (item.alarm ? 'Alarm set' : 'Escalate to alarm') + '</button>' : '') +
         '<button class="abtn" data-act="up" data-id="' + esc(item.id) + '">↑ Earlier</button>' +
         '<button class="abtn" data-act="down" data-id="' + esc(item.id) + '">↓ Later</button>' +
         (item.status !== 'in_progress' ? '<button class="abtn" data-act="reject" data-id="' + esc(item.id) + '">✕ Reject</button>' : '') +
         (['approved', 'in_progress'].includes(item.status) ? '<button class="abtn" data-act="pause" data-id="' + esc(item.id) + '">Ⅱ Pause</button>' : '') +
         (item.status === 'paused' ? '<button class="abtn" data-act="resume" data-id="' + esc(item.id) + '">▶ Resume</button>' : '') +
         (['approved', 'in_progress', 'paused'].includes(item.status) ? '<button class="abtn" data-act="done" data-id="' + esc(item.id) + '">✔ Mark done</button>' : '') +
         (['proposed', 'modified', 'paused'].includes(item.status) ? '<button class="abtn" data-act="archive" data-id="' + esc(item.id) + '">Archive from waiting</button>' : '') +
         '</div>';
  } else if (item.status === 'archived') {
    h += '<div class="field"><div class="field-label">Archived, not completed</div><div class="shape">Previous status: ' + esc(item.archived_from || 'waiting') + '</div></div>' +
         '<div class="actions"><button class="abtn" data-act="restore" data-id="' + esc(item.id) + '">↩ Restore to Waiting on You</button></div>';
  } else if (item.status === 'superseded') {
    h += '<div class="field"><div class="field-label">Retired safely</div><div class="shape">Replacement: ' +
         esc(item.superseded_by || 'recorded in the hot-load ledger') + '</div></div>';
  }
  if (item.negotiation_log && item.negotiation_log.length) {
    h += '<div class="neglog"><div class="field-label">Negotiation history</div>';
    item.negotiation_log.slice().reverse().forEach(e => {
      if (typeof e === 'string') {
        h += '<div class="neglog-entry">' + esc(e) + '</div>';
        return;
      }
      h += '<div class="neglog-entry' + (e.who === 'user' ? ' user' : '') + '">' +
           '<span class="who">' + (e.who === 'user' ? 'YOU' : 'ITER') + '</span> ' +
           '<span class="t">' + esc(e.time || '') + '</span><br>' + esc(e.text || '') + '</div>';
    });
    h += '</div>';
  }
  return h;
}

function wireCards() {
  document.querySelectorAll('.opt').forEach(el => {
    el.onclick = async () => {
      const oi = +el.dataset.oi;
      const item = data.items.find(i => i.id === el.dataset.id);
      if (!item) return;
      try {
        const negotiation = (item.negotiation_log || []).concat([{
          time: nowStr(), who: 'user', text: 'Leaning toward: ' + item.options[oi].label,
        }]);
        await protocolCommand('modify', item, {
          selected_option: oi,
          negotiation_log: negotiation,
        }, 'human-option:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
        render();
        toast('Choice noted — signatures reset for the revised card');
      } catch (err) { console.error('option click failed:', err); toast('Option failed to save — please type your choice instead'); }
    };
  });
  document.querySelectorAll('.orders-box').forEach(el => {
    el.onclick = async () => {
      const item = data.items.find(i => i.id === el.dataset.id);
      if (!item) return;
      try {
        const text = document.getElementById('ta-' + item.id).value;
        if (text !== (item.user_input || '')) {
          const negotiation = (item.negotiation_log || []).concat([{
            time: nowStr(), who: 'user', text: 'Scope changed before signing: ' + text,
          }]);
          await protocolCommand('modify', item, {
            user_input: text,
            negotiation_log: negotiation,
          }, 'human-modify:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render();
          toast('Card changed — prior attestations revoked; guardian must re-check it');
          return;
        }
        if (hasHumanSignature(item)) {
          render();
          toast('This version is already signed; modify the card to revoke and re-sign');
          return;
        }
        await protocolCommand('sign', item, {
          signer_id: 'human:owner',
          role: 'human_owner',
          proof: { type: 'trusted_local_session_v1', value: crypto.randomUUID() },
        }, 'human-sign:' + item.id + ':v' + item.proposal_version);
        render();
        const signed = data.items.find(i => i.id === item.id);
        toast(signed && signed.status === 'approved'
          ? 'Approval threshold satisfied ✅'
          : 'Owner signature recorded; waiting for remaining role');
      } catch (err) {
        console.error('approval signing failed:', err);
        render();
        toast(String(err.message || err));
      }
    };
  });
  document.querySelectorAll('.abtn').forEach(el => {
    el.onclick = async () => {
      const act = el.dataset.act;
      const item = data.items.find(i => i.id === el.dataset.id);
      if (!item) return;
      try {
        if (act === 'negotiate') {
          if (item.status === 'in_progress') {
            toast('Pause active work before changing its scope');
            return;
          }
          const txt = prompt('What should change about the shape of this work?');
          if (txt) {
            const negotiation = (item.negotiation_log || []).concat([{
              time: nowStr(), who: 'user', text: txt,
            }]);
            await protocolCommand('modify', item, {
              negotiation_log: negotiation,
            }, 'human-counter:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
            render(); toast('Tweak logged — signatures reset for the revised card');
          }
        } else if (act === 'alarm') {
          let alarm = null;
          if (!item.alarm) {
            alarm = prompt('When should this ping you? (e.g. "tomorrow 9am" or "2026-09-18 09:00")', 'tomorrow 9am');
            if (!alarm) return;
          }
          await protocolCommand('modify', item, { alarm },
            'human-alarm:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast(alarm ? 'Alarm set: ' + alarm : 'Alarm cleared');
        } else if (act === 'reject') {
          await protocolCommand('reject', item, { reason: 'Rejected from the PWQ board' },
            'human-reject:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast('Proposal rejected');
        } else if (act === 'up' || act === 'down') {
          const index = data.items.indexOf(item);
          const target = act === 'up' ? index - 1 : index + 1;
          if (target >= 0 && target < data.items.length) {
            await protocolCommand('reorder', item, { position: target },
              'human-reorder:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
            render(); toast('Queue reordered');
          }
        } else if (act === 'pause') {
          await protocolCommand('pause', item, { reason: 'Paused from the PWQ board' },
            'human-pause:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast('Work paused');
        } else if (act === 'resume') {
          await protocolCommand('resume', item, {
            dispatch_authorization: item.dispatch_authorization,
          }, 'human-resume:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast('Work resumed under the existing authorization');
        } else if (act === 'archive') {
          await protocolCommand('archive', item, {},
            'human-archive:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast('Archived; history kept. Restore it from Archived.');
        } else if (act === 'restore') {
          await protocolCommand('restore', item, {},
            'human-restore:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast('Restored to its previous waiting status');
        } else if (act === 'done') {
          await protocolCommand('complete', item, { note: 'Marked complete from the PWQ board' },
            'human-complete:' + item.id + ':v' + item.proposal_version + ':' + Date.now());
          render(); toast('Marked done');
        }
      } catch (err) {
        console.error('PWQ command failed:', err);
        render();
        toast(String(err.message || err));
      }
    };
  });
}

load('initial');
setInterval(() => load('interval'), LIVE_REFRESH_MS);
window.addEventListener('focus', () => load('focus'));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load('visibility');
});
</script>
