<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iter Map Station</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--accent:#4fd1c5;--accent2:#f6ad55;--text:#e2e8f0;--muted:#8a97a8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0e11;color:var(--text);overflow:hidden}
  #map{position:absolute;inset:0;z-index:1}
  .leaflet-container{background:#0b0e11}
  #dock{position:absolute;z-index:1000;top:14px;left:14px;width:340px;max-width:calc(100vw - 28px);
        background:rgba(16,20,24,.92);backdrop-filter:blur(14px);border:1px solid #232a33;
        border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
  #dock header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #232a33}
  #dock header .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4fd1c5,#3182ce);display:flex;align-items:center;justify-content:center;font-weight:800;color:#07121a;font-size:15px}
  #dock header h1{font-size:15px;font-weight:700}
  #dock header .sub{font-size:11px;color:var(--muted);margin-top:1px}
  #dock header[role="button"]{cursor:pointer}
  #dock header[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:12px}
  #dock.collapsed .logo,#dock.collapsed header .sub{display:none}
  #dock.collapsed header{border-bottom:0}
  #dock.collapsed .chips,#dock.collapsed #chatlog,#dock.collapsed #inputRow{display:none}
  .chips{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid #232a33}
  .chip{cursor:pointer;user-select:none;font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid #2c3542;background:#151b22;color:var(--text);transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  #chatlog{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:46vh}
  .msg{font-size:13px;line-height:1.45;padding:8px 11px;border-radius:12px;max-width:92%;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:#1d4ed8aa;border:1px solid #3b82f6;color:#fff}
  .msg.iter{align-self:flex-start;background:#151b22;border:1px solid #232a33}
  .msg .stamp{display:block;font-size:10px;color:var(--muted);margin-top:4px}
  #inputRow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #232a33}
  #cmd{flex:1;background:#0d1116;border:1px solid #2c3542;color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;outline:none}
  #cmd:focus{border-color:var(--accent)}
  #sendBtn{background:var(--accent);border:none;border-radius:10px;padding:0 14px;font-weight:700;color:#07201d;cursor:pointer}
  #sendBtn:disabled{opacity:.4}
  #status{position:absolute;z-index:1000;top:14px;right:150px;background:rgba(16,20,24,.92);border:1px solid #232a33;border-radius:12px;padding:8px 13px;font-size:11.5px;color:var(--muted);max-width:320px}
  #status b{color:var(--accent)}
  #locateBtn{position:absolute;z-index:1001;top:14px;right:14px;min-height:42px;padding:0 14px;border:1px solid #2c3542;border-radius:12px;background:rgba(16,20,24,.94);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #locateBtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  #locateBtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #locateBtn:disabled{opacity:.65;cursor:wait}
  #pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .card{position:absolute;z-index:1000;bottom:16px;right:14px;width:340px;max-height:44vh;overflow-y:auto;background:rgba(16,20,24,.94);border:1px solid #232a33;border-radius:16px;padding:12px;display:none}
  .card h3{font-size:13px;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between}
  .card h3 .x{cursor:pointer;color:var(--muted);font-weight:400}
  #resultsCard h3 #cardTitle{cursor:pointer}
  #resultsCard h3 #cardTitle:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
  #resultsCard.collapsed{max-height:none;overflow:hidden}
  #resultsCard.collapsed h3{margin-bottom:0}
  #resultsCard.collapsed #results,#resultsCard.collapsed #cardClose{display:none}
  .res{border:1px solid #232a33;border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;transition:.15s;background:#131920}
  .res:hover{border-color:var(--accent)}
  .res .nm{font-size:12.5px;font-weight:600}
  .res .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .agent-pin{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#4fd1c5,#3182ce);box-shadow:0 4px 14px rgba(0,0,0,.55);border:2px solid #0b0e11;display:flex;align-items:center;justify-content:center}
  .agent-pin span{transform:rotate(45deg);font-weight:900;font-size:15px;color:#07121a}
  .user-pin{width:22px;height:22px;border-radius:50%;background:#f6ad55;border:3px solid #07121a;box-shadow:0 0 0 6px rgba(246,173,85,.25),0 4px 14px rgba(0,0,0,.6)}
  .res-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent2);border:2px solid #0b0e11;box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .res-pin span{transform:rotate(45deg);font-size:13px}
  .res-pin.c-restaurant{background:#f5695c} .res-pin.c-cafe{background:#e0a84f}
  .res-pin.c-metro{background:#6ba8f5} .res-pin.c-pharmacy{background:#7ed957}
  .res-pin.c-hospital{background:#e85d75} .res-pin.c-lodging{background:#55c6b0}
  .res-pin.c-poi{background:#c77dff} .res-pin.c-travel{background:#ff9ecb}
  .leaflet-marker-icon.hidden{display:none}
  #legend{position:absolute;z-index:1000;bottom:16px;left:14px;background:rgba(16,20,24,.92);border:1px solid #232a33;border-radius:12px;padding:8px 12px;font-size:11.5px;color:#8a97a8;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 420px)}
  #legend .lgi{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;border:1px solid transparent;transition:.15s}
  #legend .lgi:hover{border-color:#2c3542}
  #legend .lgi.off{opacity:.35;text-decoration:line-through}
  #legend .lgi.solo{border-color:#4da3ff;box-shadow:0 0 8px rgba(77,163,255,.5)}
  #legend .lgi b{width:10px;height:10px;border-radius:50%;display:inline-block}
  .leaflet-popup-content-wrapper{background:#101418;color:#e2e8f0;border:1px solid #2c3542;border-radius:12px}
  .leaflet-popup-tip{background:#101418}
  .leaflet-popup-content{font-size:12.5px;line-height:1.5;margin:10px 12px}
  .leaflet-container a.leaflet-popup-close-button{color:#8a97a8}
  .place-details{margin-top:5px}.place-details>div{margin-top:3px}.place-links,.place-directions{margin-top:6px}.place-source{font-size:10px;color:#8a97a8;margin-top:6px}.place-details a{color:#73c8ff;text-decoration:none}.place-details a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#232a33;border-radius:4px}
</style>
</head>
<body>
<div id="map"></div>
<div id="status"><span id="pulse"></span><span id="statusText">Booting Map Station...</span></div>
<button id="locateBtn" type="button" aria-label="Refresh the map at my current location" title="Request your current location and reload the map">◎ Locate me</button>
<div id="dock">
  <header id="dockHeader" role="button" tabindex="0" aria-expanded="true" aria-controls="chips chatlog inputRow" title="Double-click or press Enter to collapse or expand">
    <div class="logo">&#9670;</div>
    <div><h1>Iter Map Station</h1><div class="sub">talk to your agent &middot; anywhere you are</div></div>
  </header>
  <div class="chips">
    <div class="chip" data-q="restaurants near me">&#127861; Restaurants</div>
    <div class="chip" data-q="cafes near me">&#9749; Caf&eacute;s</div>
    <div class="chip" data-q="nearest metro stations">&#128647; Metro</div>
    <div class="chip" data-q="things to do near me">&#127905; Things to do</div>
    <div class="chip" data-q="pharmacies near me">&#128138; Pharmacy</div>
    <div class="chip" data-q="hospitals near me">&#127973; Hospitals</div>
    <div class="chip" data-q="hotels resorts spas near me">&#127976; Hotels &amp; spas</div>
  </div>
  <div id="chatlog"></div>
  <div id="inputRow">
    <input id="cmd" placeholder="Ask Iter... e.g. best ramen nearby" autocomplete="off"/>
    <button id="sendBtn">Send</button>
  </div>
</div>
<div id="legend">
  <span style="width:100%">Show / hide layers:</span>
  <span class="lgi" data-cat="restaurant"><b style="background:#f5695c"></b>&#127861; Restaurants</span>
  <span class="lgi" data-cat="cafe"><b style="background:#e0a84f"></b>&#9749; Caf&eacute;s</span>
  <span class="lgi" data-cat="metro"><b style="background:#6ba8f5"></b>&#128647; Metro</span>
  <span class="lgi" data-cat="pharmacy"><b style="background:#7ed957"></b>&#128138; Pharmacy</span>
  <span class="lgi" data-cat="hospital"><b style="background:#e85d75"></b>&#127973; Hospitals</span>
  <span class="lgi" data-cat="lodging"><b style="background:#55c6b0"></b>&#127976; Hotels &amp; spas</span>
  <span class="lgi" data-cat="poi"><b style="background:#c77dff"></b>&#127905; Things to do</span>
  <span class="lgi" data-cat="travel"><b style="background:#ff9ecb"></b>&#9992; Travel</span>
</div>
<div class="card" id="resultsCard">
  <h3><span id="cardTitle" role="button" tabindex="0" aria-expanded="true" title="Double-click or press Enter to collapse or expand">Results</span><span class="x" id="cardClose">&#10005;</span></h3>
  <div id="results"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const dock = $('dock'), dockHeader = $('dockHeader');
  const resultsCard = $('resultsCard'), cardTitle = $('cardTitle');
  const toggleCollapsed = (panel, control) => {
    const collapsed = panel.classList.toggle('collapsed');
    control.setAttribute('aria-expanded', String(!collapsed));
  };
  dockHeader.addEventListener('dblclick', () => toggleCollapsed(dock, dockHeader));
  dockHeader.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCollapsed(dock, dockHeader); }
  });
  resultsCard.querySelector('h3').addEventListener('dblclick', e => {
    if (e.target.closest('#cardClose')) return;
    toggleCollapsed(resultsCard, cardTitle);
  });
  cardTitle.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCollapsed(resultsCard, cardTitle); }
  });
  const state = { pos: null, resultMarkers: [], lastResults: [], resultsTitle: null, offCats: {}, solo: null };
  const log = (html, cls) => {
    const m = document.createElement('div');
    m.className = 'msg ' + (cls || 'iter');
    m.innerHTML = html + '<span class="stamp">' + new Date().toLocaleTimeString() + '</span>';
    $('chatlog').appendChild(m); $('chatlog').scrollTop = 1e9; return m;
  };
  const setStatus = t => { $('statusText').innerHTML = t; };

  const map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([40.7128, -74.006], 12);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19
  }).addTo(map);

  let userMarker = null, agentMarker = null;
  function placeUser(lat, lon, label) {
    state.pos = { lat, lon, label: label || 'You' };
    if (userMarker) userMarker.remove();
    userMarker = L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="user-pin"></div>', iconSize: [22,22], iconAnchor: [11,11] }), draggable: true })
      .addTo(map).bindPopup('<b>' + (label || 'You') + '</b><br>Drag me or double-click the map to move.');
    userMarker.on('dragend', () => { const p = userMarker.getLatLng(); state.pos = { lat: p.lat, lon: p.lng, label: 'You (manual)' }; setStatus('<b>Position set</b> &middot; ' + p.lat.toFixed(4) + ', ' + p.lng.toFixed(4)); });
    if (!agentMarker) {
      agentMarker = L.marker([lat + 0.004, lon + 0.004], { icon: L.divIcon({ className: '', html: '<div class="agent-pin"><span>ITER</span></div>', iconSize: [36,36], iconAnchor: [18,34] }), zIndexOffset: 500 })
        .addTo(map).bindPopup('<b>Iter agent</b><br>Your on-map assistant. Ask me anything in the dock!');
    } else { agentMarker.setLatLng([lat + 0.004, lon + 0.004]); }
    map.setView([lat, lon], 14, { animate: true });
  }
  function clearResults() { map.closePopup(); state.resultMarkers.forEach(m => m.remove()); state.resultMarkers = []; state.lastResults = []; }
  const escapeHTML = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  function detailRows(r) {
    const t = r.details || {};
    const rows = [];
    const add = (label, value) => { if (value) rows.push('<div><strong>' + label + ':</strong> ' + escapeHTML(value) + '</div>'); };
    add('Cuisine', t.cuisine);
    add('Address', [t['addr:housenumber'], t['addr:street'], t['addr:unit'], t['addr:place'], t['addr:city'], t['addr:postcode']].filter(Boolean).join(' '));
    add('Phone', t.phone || t['contact:phone']);
    add('Email', t.email || t['contact:email']);
    add('Hours', t.opening_hours);
    const links = [];
    const website = t.website || t['contact:website'] || t.url;
    if (website && /^https?:\/\//i.test(website)) links.push('<a target="_blank" rel="noopener noreferrer" href="' + escapeHTML(website) + '">Website</a>');
    const phone = t.phone || t['contact:phone'];
    if (phone) links.push('<a href="tel:' + escapeHTML(phone.replace(/[^+0-9*#;,]/g, '')) + '">Call</a>');
    if (t.menu || t['contact:menu'] || t['website:menu'] || t['menu:website']) {
      const menu = t.menu || t['contact:menu'] || t['website:menu'] || t['menu:website'];
      if (/^https?:\/\//i.test(menu)) links.push('<a target="_blank" rel="noopener noreferrer" href="' + escapeHTML(menu) + '">Menu</a>');
    }
    const destination = encodeURIComponent(Number(r.lat) + ',' + Number(r.lon));
    const origin = state.pos && Number.isFinite(Number(state.pos.lat)) && Number.isFinite(Number(state.pos.lon))
      ? '&amp;origin=' + encodeURIComponent(Number(state.pos.lat) + ',' + Number(state.pos.lon)) : '';
    const directions = ['walking','driving','transit','bicycling'].map(mode => '<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&amp;destination=' + destination + origin + '&amp;travelmode=' + mode + '">' + ({walking:'Walk',driving:'Drive',transit:'Transit',bicycling:'Cycle'}[mode]) + '</a>');
    const listingQuery = encodeURIComponent((r.name || '') + ' ' + r.lat + ',' + r.lon);
    links.push('<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=' + listingQuery + '">Google Maps listing (reviews if available)</a>');
    if (t['osm_type'] && t['osm_id']) links.push('<a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/' + escapeHTML(t['osm_type']) + '/' + encodeURIComponent(t['osm_id']) + '">OpenStreetMap</a>');
    if (links.length) rows.push('<div class="place-links">' + links.join(' · ') + '</div>');
    rows.push('<div class="place-directions">Directions (opens Google Maps): ' + directions.join(' · ') + '</div>');
    rows.push('<div class="place-source">Details are OpenStreetMap tags when available; missing fields are not supplied. Google Maps links may show reviews and calculate route distance/time.</div>');
    return rows.join('');
  }
  const osmDetailCache = new Map();
  function markerPopup(r) {
    const safeName = escapeHTML(r.name || 'Spot');
    return '<b>' + safeName + '</b>' + (r.meta ? '<br>' + escapeHTML(r.meta) : '') + '<div class="place-details">' + detailRows(r) + '</div>';
  }
  async function enrichMarkerDetails(marker, r) {
    const type = r.details && r.details.osm_type, id = r.details && r.details.osm_id;
    if (!['node','way','relation'].includes(type) || !/^\d+$/.test(String(id || ''))) return;
    const key = type + '/' + id;
    const popup = marker.getPopup();
    if (popup && popup.isOpen()) popup.setContent(markerPopup(r) + '<div class="place-source" data-osm-loading>Loading additional OpenStreetMap details…</div>');
    try {
      let pending = osmDetailCache.get(key);
      if (!pending) {
        pending = fetch('https://api.openstreetmap.org/api/0.6/' + key + '.json')
          .then(response => { if (!response.ok) throw new Error('OSM details HTTP ' + response.status); return response.json(); })
          .then(data => {
            const element = data && Array.isArray(data.elements) && data.elements.find(e => e.type === type && String(e.id) === String(id));
            if (!element || !element.tags) throw new Error('No OSM tags in detail response');
            return element.tags;
          });
        osmDetailCache.set(key, pending);
      }
      const tags = await pending;
      r.details = { ...r.details, ...tags, osm_type: type, osm_id: id };
      r.name = tags.name || r.name;
      r.meta = [tags.cuisine, tags.operator].filter(Boolean).join(' · ') || r.meta;
      if (marker.getPopup() && marker.getPopup().isOpen()) marker.setPopupContent(markerPopup(r));
    } catch (err) {
      // Keep the already useful popup; detail lookup is optional and never blocks map use.
      osmDetailCache.delete(key);
      const el = marker.getPopup() && marker.getPopup().getElement();
      const loading = el && el.querySelector('[data-osm-loading]');
      if (loading) loading.textContent = 'Additional OpenStreetMap details are temporarily unavailable.';
    }
  }
  function addResult(r, i) {
    const cat = r.cat || 'poi';
    const icons = { restaurant: '&#127861;', cafe: '&#9749;', metro: '&#128647;', pharmacy: '&#128138;', hospital: '&#127973;', lodging: '&#127976;', poi: '&#127905;', travel: '&#9992;' };
    const mk = L.marker([r.lat, r.lon], { icon: L.divIcon({ className: '', html: '<div class="res-pin c-' + cat + '"><span>' + (icons[cat] || (i+1)) + '</span></div>', iconSize: [30,30], iconAnchor: [15,28] }) })
      .addTo(map).bindPopup(markerPopup(r), { maxWidth: 320 });
    mk.on('popupopen', () => { enrichMarkerDetails(mk, r); });
    mk._cat = cat;
    if (state.offCats[cat]) { const el = mk.getElement(); if (el) el.classList.add('hidden'); }
    state.resultMarkers.push(mk);
  }
  function showResultsCard(title, results) {
    $('cardTitle').textContent = title; $('results').innerHTML = '';
    results.forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'res';
      d.innerHTML = '<div class="nm">' + (i+1) + '. ' + escapeHTML(r.name || 'Spot') + '</div><div class="meta">' + escapeHTML(r.cat || 'poi') + (r.meta ? ' &middot; ' + escapeHTML(r.meta) : '') + '</div>';
      d.onclick = () => { map.setView([r.lat, r.lon], 16); state.resultMarkers[i] && state.resultMarkers[i].openPopup(); };
      $('results').appendChild(d);
    });
    $('resultsCard').style.display = 'block';
  }

  const pendingLocationKey = 'iterMapPendingLocation';
  function announceLocation(lat, lon, label) {
    window.dispatchEvent(new CustomEvent('iter-location-ready', { detail: { lat, lon, label } }));
  }
  function useApproximateCenter(message) {
    if (!state.pos) {
      const c = map.getCenter();
      placeUser(c.lat, c.lng, 'You (approx)');
    }
    setStatus(message ? 'Approximate pin &middot; ' + message : 'GPS unavailable - showing an approximate map-center pin');
    if (message) log(message + ' The pin is approximate; drag it or double-click the map to adjust it.');
  }
  // Where a fix came from: 'native' (the Core Location helper, M11-A3) or 'gps' (navigator.geolocation).
  const sourceLabel = source => source === 'native' ? 'You (native)' : 'You (GPS)';
  const sourceSuffix = source => source === 'native' ? ' (native)' : '';
  const validFix = (lat, lon) => Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  function restorePendingLocation() {
    try {
      const raw = sessionStorage.getItem(pendingLocationKey);
      if (!raw) return false;
      sessionStorage.removeItem(pendingLocationKey);
      const p = JSON.parse(raw);
      if (!validFix(p.lat, p.lon)) return false;
      placeUser(p.lat, p.lon, sourceLabel(p.source));
      setStatus('<b>Location refreshed</b> &middot; ' + p.lat.toFixed(4) + ', ' + p.lon.toFixed(4) + sourceSuffix(p.source));
      setTimeout(() => announceLocation(p.lat, p.lon, sourceLabel(p.source)), 0);
      return true;
    } catch (_) { return false; }
  }

  // The honest reason a route failed, in the person's words (M11-A3).
  const DENIED = 'Location permission was denied — in System Settings → Privacy &amp; Security → Location Services, turn Location Services on and allow <b>CoreLocationCLI</b> (or iter_location). If it is not listed yet, run <code>CoreLocationCLI</code> once in Terminal to get the prompt.';
  function nativeReason(result) {
    const reason = result && result.reason;
    if (reason === 'no-helper') return 'No location helper on this Mac — ' + ((result && result.hint) || 'brew install corelocationcli') + '.';
    if (reason === 'denied') return DENIED;
    if (reason === 'timeout') return 'The location helper timed out.';
    if (reason === 'not-allowed') return 'This page may not ask for native location.';
    return 'The location helper could not get a fix.';
  }
  function geolocationReason(err) {
    if (err && err.code === 1) return DENIED;
    if (err && err.code === 3) return 'Location request timed out.';
    return 'Current location is unavailable.';
  }
  function nativeFix() {

    // button: the native helper is reachable only from the app tab.
    if (!window.iterApp || typeof window.iterApp.locate !== 'function') {
      return Promise.resolve({ reason: 'Native location works when Map Station is opened from the Apps button (this tab was opened by URL).' });
    }
    return Promise.resolve()
      .then(() => window.iterApp.locate())
      .then(r => (r && r.ok && validFix(r.lat, r.lon)) ? { lat: r.lat, lon: r.lon } : { reason: nativeReason(r) })

  function geolocationFix() {

        p => {

  // Native helper first, then the browser's geolocation, then the approximate center. The final
  // status names the first real reason, never a hopeful one.
  async function locate(options = {}) {
    const button = $('locateBtn');
    const done = () => { if (button) { button.disabled = false; button.textContent = '◎ Locate me'; } };
    if (button) { button.disabled = true; button.textContent = 'Locating…'; }
    setStatus(options.reload ? 'Getting your location before reloading…' : 'Locating you…');
    let firstReason = null;
    let fix = null, source = null;
    const native = await nativeFix();
    if (native && !native.reason) { fix = native; source = 'native'; }
    else {
      if (native) firstReason = native.reason;
      const geo = await geolocationFix();
      if (!geo.reason) { fix = geo; source = 'gps'; }
      else firstReason = firstReason || geo.reason;
    }
    if (!fix) {
      useApproximateCenter(firstReason);
      done();
      return;
    }
    const { lat, lon } = fix;
    if (options.reload) {
      try {
        sessionStorage.setItem(pendingLocationKey, JSON.stringify({ lat, lon, source }));
        location.reload();
        return;
      } catch (_) {
        placeUser(lat, lon, sourceLabel(source));
        setStatus('Location found, but page reload is unavailable; map centered without reloading.');
      }
    } else {
      placeUser(lat, lon, sourceLabel(source));
      setStatus('<b>Location locked</b> &middot; ' + lat.toFixed(4) + ', ' + lon.toFixed(4) + sourceSuffix(source));
      log('Position acquired. Map centered on you. Ask away - restaurants, metro, travel plans...');
      announceLocation(lat, lon, sourceLabel(source));

  function intentOf(q) {
    const pos = state.pos || map.getCenter();
    if (/hospital|clinic|doctor|medical|health.?care/i.test(q)) return { title: 'Hospitals & care', cat: 'hospital', icon: '&#127973;' };
    if (/hotel|resort|spa|hostel|motel|guest.?house|lodging|stay|sleep/i.test(q)) return { title: 'Hotels & spas', cat: 'lodging', icon: '&#127976;' };
    if (/restaurant|ramen|food|eat|dinner|lunch|hungry|pizza|sushi|burger/i.test(q)) return { title: 'Restaurants', cat: 'restaurant', icon: '&#127861;' };
    if (/caf/i.test(q)) return { title: 'Cafes', cat: 'cafe', icon: '&#9749;' };
    if (/metro|subway|train|transit|station/i.test(q)) return { title: 'Metro', cat: 'metro', icon: '&#128647;' };
    if (/pharmac|drugstore|medicine|chemist/i.test(q)) return { title: 'Pharmacies', cat: 'pharmacy', icon: '&#128138;' };
    if (/things|attraction|museum|fun|todo|park|see|activity|activities|visit/i.test(q)) return { title: 'Things to do', cat: 'poi', icon: '&#127905;' };

    const out = [];

      out.push({ name: intent.icon + ' ' + intent.title + ' #' + (i+1) + ' - ' + labels[i],
        cat: intent.cat,
        lat: center.lat + (Math.random()-0.5)*0.02, lon: center.lon + (Math.random()-0.5)*0.02,
        meta: 'approx ' + (Math.random()*2+0.2).toFixed(1) + ' km - agent will refine with live data' });
    }
    return out;
  }

  function handle(q) {
    log(q.replace(/</g, '&lt;'), 'user');
    const intent = intentOf(q);
    const t = log('Got it - working on &ldquo;' + q.replace(/</g, '&lt;') + '&rdquo;...');
    if (!intent) {
      setTimeout(() => { t.innerHTML = 'I can search <b>restaurants</b>, <b>caf&eacute;s</b>, <b>metro</b>, <b>pharmacies</b>, <b>things to do</b>, and <b>travel</b> around your pin. Try a chip button or type a question!<span class="stamp">' + new Date().toLocaleTimeString() + '</span>'; }, 700);
      return;
    }
    setTimeout(() => {
      const pos = mapCoordinates(state.pos || map.getCenter());
      const results = placeholderResults(intent, pos);
      t.innerHTML = 'Here is what I found for <b>' + intent.title + '</b> - plotted on the map with the results card. Say &ldquo;refine results&rdquo; and I will swap in live listings.<span class="stamp">' + new Date().toLocaleTimeString() + '</span>';

      showResultsCard(intent.title + ' (near you)', results);
      const b = L.latLngBounds(results.map(r => [r.lat, r.lon])); b.extend([pos.lat, pos.lon]);
      map.fitBounds(b, { padding: [40, 40] });

  $('sendBtn').onclick = () => { const v = $('cmd').value.trim(); if (v) { $('cmd').value = ''; handle(v); } };

    state.resultMarkers.forEach(mk => {
      const el = mk.getElement(); if (!el) return;
      el.classList.toggle('hidden', !!state.offCats[mk._cat]);
    });
  }
  const CATS = ['restaurant','cafe','metro','pharmacy','hospital','lodging','poi','travel'];
  document.querySelectorAll('#legend .lgi').forEach(li => {
    li.title = 'Click: toggle this category · Double-click: show ONLY this category';
    li.onclick = () => {
      const cat = li.dataset.cat;
      state.offCats[cat] = !state.offCats[cat];
      state.solo = null;
      document.querySelectorAll('#legend .lgi').forEach(x => x.classList.remove('solo'));
      li.classList.toggle('off', state.offCats[cat]);
      applyCats();
    };
    li.ondblclick = () => {
      const cat = li.dataset.cat;
      if (state.solo === cat) {
        state.solo = null; state.offCats = {};
        document.querySelectorAll('#legend .lgi').forEach(x => x.classList.remove('off','solo'));
      } else {
        state.solo = cat; state.offCats = {};
        CATS.forEach(c => { if (c !== cat) state.offCats[c] = true; });
        document.querySelectorAll('#legend .lgi').forEach(x => x.classList.toggle('off', x.dataset.cat !== cat));
        li.classList.add('solo'); li.classList.remove('off');
      }
      applyCats();
    };
  });
  map.on('dblclick', e => { placeUser(e.latlng.lat, e.latlng.lng, 'You (manual)'); setStatus('<b>Position set</b> &middot; ' + e.latlng.lat.toFixed(4) + ', ' + e.latlng.lng.toFixed(4)); });

  log('Welcome to <b>Map Station</b> - I am Iter, your on-map agent. Getting your location...');
  if (!restorePendingLocation()) locate();

  window.iterMap = {
    map, placeUser, addResult, clearResults, showResultsCard,
    getPos: () => state.pos || map.getCenter(),
    results: (title, arr, fit = true, persist = true) => { clearResults(); arr.forEach(addResult); state.lastResults = arr.slice(); state.resultsTitle = title; if (persist) { try{ localStorage.setItem('iterMapCache', JSON.stringify(arr)); }catch(e){} }; showResultsCard(title, arr);
      if (fit && arr.length) { const b = L.latLngBounds(arr.map(r => [r.lat, r.lon])); map.fitBounds(b, { padding: [40,40] }); } },
    filterResultsToView: () => {
      const bounds = map.getBounds();
      const visible = state.lastResults.filter(r => Number.isFinite(Number(r.lat)) && Number.isFinite(Number(r.lon)) && bounds.contains([Number(r.lat), Number(r.lon)]));
      const title = visible.length ? 'Previously loaded places in this view (may be incomplete)' : 'No cached places in this view';
      if (visible.length !== state.lastResults.length || state.resultsTitle !== title) window.iterMap.results(title, visible, false, false);
    },
    say: (html) => log(html)
  };
})();
</script>

<script>
// Restore only cached places in the current viewport. Keep the original cache
// untouched; it may belong to another map area and must not masquerade as live data.
try {
  const saved = JSON.parse(localStorage.getItem('iterMapCache') || '[]');
  if (Array.isArray(saved) && saved.length) setTimeout(() => {
    if (!window.iterMap) return;
    const bounds = window.iterMap.map.getBounds();
    const visible = saved.filter(r => Number.isFinite(Number(r.lat)) && Number.isFinite(Number(r.lon)) && bounds.contains([Number(r.lat), Number(r.lon)]));
    if (visible.length) window.iterMap.results('Saved places in this view (offline cache; may be incomplete)', visible, false, false);
  }, 900);
} catch (_) {}
</script>

        : 'Nearby this location (OpenStreetMap)', fresh, false, false);

      } else if (fresh.length) window.iterMap.say('Updated ' + fresh.length + ' live nearby places for this map view.');
      else window.iterMap.say('No live nearby places were found in this map view.');
    }).catch(err => {
      if (thisRequest !== requestId) return;
      pendingKey = null;

      if (err.name !== 'AbortError') {

      }

    const map = window.iterMap.map;
    map.on('moveend', scheduleRefresh);
    map.on('resize', scheduleRefresh);
    // Leaflet's map resize event is not guaranteed when a parent is resized
    // by the app shell, so observe the map element as well.
    if (window.ResizeObserver) {
      let observedWidth = 0, observedHeight = 0;
      const observer = new ResizeObserver(entries => {
        const rect = entries[0] && entries[0].contentRect;
        if (!rect || (rect.width === observedWidth && rect.height === observedHeight)) return;
        observedWidth = rect.width; observedHeight = rect.height;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          map.invalidateSize({ pan: false, debounceMoveend: true });
          scheduleRefresh();
        }, 250);
      });
      observer.observe(map.getContainer());
    } else {
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          map.invalidateSize({ pan: false, debounceMoveend: true });
          scheduleRefresh();
        }, 250);
      });
    }
    window.addEventListener('iter-location-ready', scheduleRefresh);
    // Include the initial view, even if location acquisition doesn't move it.
    setTimeout(scheduleRefresh, 1500);
  }
})();
</script>
</body>
